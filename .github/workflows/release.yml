name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Create GitHub Release and upload userscript
        run: gh release create "$GITHUB_REF_NAME" dist/hsguru-zh-cn.user.js --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
